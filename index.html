  :root {
    --c-bg: #F8F6F4; --c-teal: #03EDC3; --c-ink: #141414; --c-track: #EBE8E7; --c-muted: #707070;
    --ease-standard: cubic-bezier(.4, 0, .2, 1);
    --page-bg: #EDEBE8; --panel-bg: #FFFFFF; --panel-ink: #141414; --panel-muted: #6B6B6B; --panel-line: #E4E1DE; --accent: #141414;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page-bg: #111111; --panel-bg: #1B1B1B; --panel-ink: #F2F2F2; --panel-muted: #9A9A9A; --panel-line: #2C2C2C; --accent: #03EDC3; }
  }
  :root[data-theme="dark"] { --page-bg: #111111; --panel-bg: #1B1B1B; --panel-ink: #F2F2F2; --panel-muted: #9A9A9A; --panel-line: #2C2C2C; --accent: #03EDC3; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page-bg); color: var(--panel-ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; min-height: 100vh; overflow-x: hidden; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-block: 32px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ================= DEVICE ================= */
  .device { --scale: 1; width: calc(414px * var(--scale)); height: calc(868px * var(--scale)); flex: none; }
  .device-inner { width: 414px; height: 868px; padding: 12px; border-radius: 64px; background: #0B0B0B; box-shadow: 0 0 0 2px #2A2A2A inset, 0 30px 60px -20px rgba(0,0,0,.35); transform: scale(var(--scale)); transform-origin: 0 0; }
  .screen { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 52px; background: var(--c-bg); font-family: "TT Fellows AZ", sans-serif; color: var(--c-ink); user-select: none; -webkit-user-select: none; touch-action: pan-y; isolation: isolate; }
  .abs { position: absolute; }
  .island { position: absolute; left: 50%; top: 11px; width: 122px; height: 36px; margin-left: -61px; border-radius: 20px; background: #000; z-index: 100; }
  #home { left: 123px; top: 831px; width: 144px; height: 5px; border-radius: 2.5px; background: #000; z-index: 101; }

  #content { left: 0; top: 0; width: 390px; height: 844px; z-index: 20; background: var(--c-bg); }
  #statusbar { left: 0; top: 0; width: 390px; height: 62px; background: var(--c-bg); z-index: 40; }

  /* Stories progress — фигуры, не картинка: трек 350×4 с полным скруглением (r = h/2 = 2),
     заполнение — такая же пилюля 350×4, сдвинутая влево; её передний край тоже скруглён */
  #progress { left: 20px; top: 70px; width: 350px; height: 4px; z-index: 41; border-radius: 2px; overflow: hidden; background: var(--c-track); }
  #fill { position: absolute; left: 0; top: 0; width: 350px; height: 4px; border-radius: 2px; background: var(--c-ink); transform: translate3d(-350px,0,0); will-change: transform; }

  #lang { left: 298px; top: 90px; width: 72px; height: 32px; border-radius: 16px; background: var(--c-track); z-index: 41; border: 0; padding: 0; cursor: pointer; }
  #lang::after { content: ""; position: absolute; inset: -6px 0; }   /* зона нажатия 72×44 */
  #lang img { position: absolute; left: 8px; top: 4px; width: 24px; height: 24px; }
  #lang span { position: absolute; left: 37px; top: 0; font: 500 14px/32px -apple-system, "SF Pro Text", Roboto, system-ui, sans-serif; color: var(--c-ink); }

  /* slides: все слайды лежат стопкой, положение каждого = функция от непрерывной позиции карусели */
  #viewport { left: 0; top: 0; width: 390px; height: 844px; z-index: 20; pointer-events: none; }
  .slide { position: absolute; left: 0; top: 0; width: 390px; height: 844px; will-change: transform; visibility: hidden; }   /* до старта скрипта виден только сплэш */
  .ill { position: absolute; left: 35px; top: 184px; width: 320px; height: 314px; transform-origin: 50% 50%; }
  .ill-in { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .ill img { position: absolute; inset: 0; width: 320px; height: 314px; }
  .slide h2 { position: absolute; left: 20px; right: 20px; top: 522.5px; margin: 0; font-weight: 600; font-size: 36px; line-height: 40px; letter-spacing: 0; text-align: center; color: var(--c-ink); }
  .ln { display: block; height: 40px; }

  #gesture { left: 0; top: 130px; width: 390px; height: 560px; z-index: 30; cursor: grab; touch-action: pan-y; }
  #gesture.dragging { cursor: grabbing; }

  #cta { left: 20px; top: 702px; width: 350px; height: 56px; z-index: 25; padding: 0; border: 0; background: none; cursor: pointer; }
  #cta svg { display: block; transition: transform .12s var(--ease-standard); transform-origin: 50% 50%; }
  #cta:active svg { transform: scale(.98); }
  #terms { left: 0; top: 770px; width: 390px; height: 30px; z-index: 25; margin: 0; font: 400 14px/30px -apple-system, "SF Pro Text", Roboto, system-ui, sans-serif; color: var(--c-muted); text-align: center; }
  #terms a { position: relative; color: inherit; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  #terms a::after { content: ""; position: absolute; inset: -14px -6px; }   /* зона нажатия ≈50×44 */

  /* splash: иконка-суперэллипс и логотип внутри неё (логотип обрезан формой иконки) */
  #splash { left: 0; top: 0; width: 390px; height: 844px; z-index: 50; pointer-events: none; }
  #blob { position: absolute; left: 0; top: 0; }

  /* ================= WEB VIEW (мобильный полноэкранный режим) ================= */
  #openApp { display: none; }
  @media (max-width: 700px), (pointer: coarse) { #openApp { display: inline-flex; align-items: center; gap: 6px; } }
  #exitApp { display: none; left: 20px; top: 90px; width: 32px; height: 32px; border-radius: 16px; border: 0; padding: 0; background: var(--c-track); color: var(--c-ink); z-index: 200; cursor: pointer; align-items: center; justify-content: center; }
  #exitApp::after { content: ""; position: absolute; inset: -6px; }   /* зона нажатия 44×44 */
  #exitApp:focus-visible { outline: 2px solid #3273F6; outline-offset: 2px; }
  #webviewBg { display: none; position: fixed; inset: 0; z-index: 999; background: var(--c-bg); }
  body.webview { overflow: hidden; }
  body.webview #webviewBg { display: block; }
  body.webview .device-inner { transform: none; }
  body.webview .screen { position: fixed; left: 0; top: 0; z-index: 1000; border-radius: 0; transform-origin: 0 0; transform: translate(var(--fx, 0px), var(--fy, 0px)) scale(var(--fs, 1)); }
  body.webview .island, body.webview #home { display: none; }   /* у телефона свои */
  body.webview #exitApp { display: flex; }

  /* ================= CONTROLS + DOCS ================= */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .btn { appearance: none; border: 1px solid var(--panel-line); background: var(--panel-bg); color: var(--panel-ink); border-radius: 999px; padding: 8px 16px; font: inherit; font-weight: 550; cursor: pointer; min-height: 40px; }
  .btn:hover { border-color: var(--panel-muted); }
  .btn[aria-pressed="true"] { background: var(--panel-ink); color: var(--panel-bg); border-color: var(--panel-ink); }
  .btn:focus-visible, #cta:focus-visible, #lang:focus-visible { outline: 2px solid #3273F6; outline-offset: 2px; }
  .seg-ctl { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; border: 1px solid var(--panel-line); background: var(--panel-bg); }
  .seg-ctl .btn { min-width: 52px; min-height: 34px; padding: 6px 12px; border-color: transparent; background: transparent; }
  .seg-ctl .btn[aria-pressed="true"] { background: var(--panel-ink); color: var(--panel-bg); }

  .docs { width: 100%; max-width: 980px; margin-top: 28px; display: flex; flex-direction: column; gap: 16px; }
  .docs h2 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
  .docs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
  .desc { min-width: 0; background: var(--panel-bg); border: 1px solid var(--panel-line); border-radius: 16px; padding: 20px; }
  .desc h3 { margin: 0 0 6px; font-size: 16px; font-weight: 650; }
  .desc > p { margin: 0; color: var(--panel-muted); }
  .spec { display: grid; grid-template-columns: minmax(84px, auto) 1fr; gap: 10px 14px; margin: 16px 0 0; padding-top: 16px; border-top: 1px solid var(--panel-line); font-size: 13.5px; line-height: 1.5; }
  .spec dt { color: var(--panel-muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .spec dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .spec code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; padding: 1px 4px; border-radius: 4px; background: color-mix(in srgb, var(--panel-ink) 6%, transparent); }

  @media (max-width: 520px) { .stage { padding-block: 16px 40px; } .spec { grid-template-columns: 1fr; gap: 2px 0; } .spec dd { margin-bottom: 8px; } }
</style>
</head>

      // цвет привязан к пройденному пути: с 10 % сереет, к 80 % пути — уже цвет трека
      const path = t < t3 ? 0 : seg(t, t3, F, EASE.settle);
      blobPath.setAttribute('fill', mixHex('#03EDC3', '#EBE8E7', EASE.standard(clamp01((path - 0.1) / 0.7))));
      // логотип летит вместе с иконкой (обрезан её формой), уменьшается и гаснет
      const ls = lerp(1, 0.6, seg(t, t3, 200, EASE.accel));
      logo.setAttribute('transform', `translate(${(cx - ICON.cx + LOGO.cx).toFixed(2)} ${(cy - ICON.cy + LOGO.cy).toFixed(2)}) scale(${ls.toFixed(4)}) translate(${-LOGO.cx} ${-LOGO.cy})`);
      logo.setAttribute('opacity', (1 - seg(t, t3, 160)).toFixed(3));
      // настоящая шкала проявляется под севшей полоской, затем сплэш скрывается — шва не видно
      tf(progress, { o: seg(t, t3 + 810, 80) });
      splash.style.visibility = t > t3 + 910 ? 'hidden' : '';
      // контент — одно правило: подъём на 16 px на Gentle 800 + проявление 400, сверху вниз с шагом 60 мс
      const B = t3 + 400, STEP = 60, DY = 16;
      const rise = (el, i) => {
        const s0t = B + i * STEP;
        tf(el, { y: DY * (1 - seg(t, s0t, F, EASE.gentle)), o: seg(t, s0t, 400, EASE.standard) });
      };
      rise(lang, 0);
      rise(S[0].illIn, 1);
      S[0].lines.forEach((ln) => rise(ln, 2));   // заголовок одним блоком
      rise(cta, 3);
      rise(terms, 4);
    },
  };
  // Reduce Motion: сплэш просто гаснет
  const LOADER_REDUCED = {
    storiesAt: 900, end: 900,
    render(t) {
      blobPath.setAttribute('d', 'M0 0H390V844H0Z');
      statusbar.style.opacity = '';
      splash.style.opacity = String(1 - seg(t, 600, 300));
      splash.style.visibility = t >= 900 ? 'hidden' : '';
    },
  };
  const loader = () => (reduced() ? LOADER_REDUCED : LOADER);

  /* ===================== SLIDER ===================== */
  // layout(P, d): d = k − pos — смещение слайда k от непрерывной позиции карусели (0 — на экране, +1 — следующий справа)
  const SLIDER = {
    move: { dur: 800, ease: EASE.gentle },   // и автосмена, и доводка после свайпа
    layout(P, d) { P.el.style.transform = `translate3d(${(d * W).toFixed(2)}px,0,0)`; P.el.style.opacity = ''; },
  };
  const SLIDER_REDUCED = {
    move: { dur: 200, ease: EASE.linear },
    layout(P, d) { P.el.style.transform = ''; P.el.style.opacity = clamp01(1 - Math.abs(d)).toFixed(3); },
  };
  const slider = () => (reduced() ? SLIDER_REDUCED : SLIDER);

  function layoutSlides() {
    const sl = slider();
    S.forEach((P, k) => {
      const d = k - st.pos, a = Math.abs(d);
      if (a >= 1) { P.el.style.visibility = 'hidden'; return; }
      P.el.style.visibility = 'visible';
      P.el.style.zIndex = String(10 - Math.round(a * 4));
      sl.layout(P, d);
    });
  }

  /* ===================== PROGRESS / STATE ===================== */
  function renderProgress() {
    const v = st.phase === 'intro' ? 0 : st.index + st.p;
    fill.style.transform = `translate3d(${((v / N - 1) * BAR.w).toFixed(2)}px,0,0)`;
    progress.setAttribute('aria-valuenow', v.toFixed(2));
    progress.setAttribute('aria-valuetext', `Story ${st.index + 1} of ${N}`);
  }

  /* ===================== INTRO ===================== */
  function resetStyles() {
    [content, splash, statusbar, viewport, progress, lang, cta, terms].forEach(clear);
    S.forEach((P) => { clear(P.el); clear(P.illIn); P.lines.forEach(clear); });
    blobPath.setAttribute('fill', '#03EDC3');
    logo.removeAttribute('transform'); logo.removeAttribute('opacity');
  }
  function resetAll() {
    cancelAnimationFrame(st.raf);
    Object.assign(st, { phase: 'intro', index: 0, p: 0, autoplay: false, held: false, pos: 0, anim: null });
    clock.t = 0; clock.paused = false;
    S.forEach((P, k) => { P.el.inert = k !== 0; P.el.setAttribute('aria-hidden', String(k !== 0)); });
    resetStyles();
    loader().render(0); layoutSlides(); renderProgress();
  }
  function playIntro() {
    resetAll();
    clock.last = performance.now();
    st.raf = requestAnimationFrame(loop);
  }

  // Один rAF-цикл: интро по таймлайну + заполнение шкалы + анимация позиции карусели
  function loop(now) {
    const dt = Math.min(now - clock.last, 50) * speed;
    clock.last = now;
    tick(dt);
    st.raf = requestAnimationFrame(loop);
  }
  function tick(dt) {
    const L = loader();
    // Пауза в панели останавливает только время (интро и заполнение); смена слайда, начатая жестом или стрелкой, доезжает.
    if (!clock.paused) {
      if (clock.t < L.end) { clock.t = Math.min(L.end, clock.t + dt); L.render(clock.t); }
      if (st.phase === 'intro' && clock.t >= L.storiesAt) {
        Object.assign(st, { phase: 'stories', autoplay: true, index: 0, p: 0 });
      } else if (st.autoplay && !st.held) {
        st.p += dt / SLIDE_DUR;
        if (st.p >= 1) {
          if (st.index < N - 1) goTo(st.index + 1);
          else { st.p = 1; st.autoplay = false; st.phase = 'done'; }
        }
      }
    }
    if (st.anim) {
      const A = st.anim; A.t += dt;
      const u = clamp01(A.t / A.dur);
      st.pos = lerp(A.from, A.to, A.ease(u));
      if (u >= 1) { st.pos = A.to; st.anim = null; }
    }
    layoutSlides();
    renderProgress();
  }

  /* ===================== STORIES ===================== */
  function animatePos(to) { const m = slider().move; st.anim = { from: st.pos, to, t: 0, dur: m.dur, ease: m.ease }; }
  function goTo(i) {
    i = Math.max(0, Math.min(N - 1, i));
    const changed = i !== st.index;
    st.index = i;
    // любой переход на другой слайд (в т. ч. назад после финала) обнуляет его часть шкалы и снова включает автопрокрутку
    if (changed && st.phase !== 'intro') Object.assign(st, { p: 0, autoplay: true, phase: 'stories' });
    S.forEach((P, k) => { P.el.inert = k !== i; P.el.setAttribute('aria-hidden', String(k !== i)); });
    animatePos(i);
    renderProgress();
  }

  /* ===================== GESTURES ===================== */
  // резиновый край: rubber — из «сырой» позиции пальца в экранную, unrubber — обратно (чтобы подхват во время перелёта не дёргал)
  const rubber = (p) => (p < 0 ? p * RUBBER : p > N - 1 ? N - 1 + (p - (N - 1)) * RUBBER : p);
  const unrubber = (p) => (p < 0 ? p / RUBBER : p > N - 1 ? N - 1 + (p - (N - 1)) / RUBBER : p);
  const drag = { id: null, x0: 0, y0: 0, dx: 0, moved: false, axis: null, base: 0, samples: [] };
  gesture.addEventListener('pointerdown', (e) => {
    if (st.phase === 'intro') return;
    Object.assign(drag, { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, moved: false, axis: null, base: st.pos, samples: [] });
    try { gesture.setPointerCapture(e.pointerId); } catch (_) {}
    gesture.classList.add('dragging');
    st.held = true;
  });
  gesture.addEventListener('pointermove', (e) => {
    if (e.pointerId !== drag.id) return;
    const scale = screenEl.getBoundingClientRect().width / W;
    const dx = (e.clientX - drag.x0) / scale, dy = (e.clientY - drag.y0) / scale;
    if (!drag.axis && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (drag.axis !== 'x') return;
    const now = performance.now();
    if (!drag.moved) { drag.moved = true; drag.base = unrubber(st.pos); drag.x0 = e.clientX; st.anim = null; drag.samples = [{ t: now, dx: 0 }]; return; }
    drag.dx = dx;
    drag.samples.push({ t: now, dx });
    while (drag.samples.length > 2 && now - drag.samples[0].t > 100) drag.samples.shift();
    st.pos = rubber(drag.base - dx / W);
  });
  // скорость пальца за последние ~80 мс (если палец остановился — 0)
  function releaseVelocity() {
    const s = drag.samples, now = performance.now();
    if (s.length < 2 || now - s[s.length - 1].t > 80) return 0;
    const b = s[s.length - 1];
    const a = s.find((p) => b.t - p.t <= 80) || s[0];
    return b.t > a.t ? (b.dx - a.dx) / (b.t - a.t) : 0;
  }
  const endDrag = (e) => {
    if (e.pointerId !== drag.id) return;
    drag.id = null;
    gesture.classList.remove('dragging');
    st.held = false;
    if (!drag.moved) return;
    const v = releaseVelocity(), flick = Math.abs(drag.dx) > 24;
    let target = st.index;
    if (drag.dx < -W * 0.2 || (flick && v < -0.4)) target = st.index + 1;
    else if (drag.dx > W * 0.2 || (flick && v > 0.4)) target = st.index - 1;
    target = Math.max(0, Math.min(N - 1, target));
    if (target === st.index) animatePos(st.index);   // отмена — шкала продолжает с того же места
    else goTo(target);
  };
  gesture.addEventListener('pointerup', endDrag);
  gesture.addEventListener('pointercancel', endDrag);
  document.addEventListener('keydown', (e) => {
    if (st.phase === 'intro' || e.target.closest?.('input, select, textarea')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(st.index + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(st.index - 1); }
  });

  /* ===================== PANEL: спека для разработки ===================== */
  const SPEC = {
    loader: {
      name: 'Суперэллипс перелетает в шкалу',
      essence: 'Иконка сохраняет форму суперэллипса и вытягивается в полоску шкалы. Логотип летит внутри иконки и гаснет. Полоска садится без отскока и к посадке уже серая — это и есть трек шкалы. Время от начала загрузки, мс.',
      rows: [
        ['0–1000', 'Сплэш: бирюзовый #03EDC3 на весь экран, логотип M10 по центру.'],
        ['1000', 'Статус-бар появляется сразу, без анимации.'],
        ['1000–1600', 'Сжатие в иконку 66,6×66,6 по кадрам из видео: 620×1300 → недолёт до 50×50 (330 мс) → 66,6. Форма — суперэллипс (k 0,1554, как Ellipse 1592).'],
        ['1600–2530', 'Пауза на иконке 930 мс — время на загрузку приложения.'],
        ['2530–3330', 'Перелёт в шкалу. Центр (195,3; 421,3) → (195; 72) и ширина 66,6 → 350 — пружина без перелёта 800 мс: stiffness 100, damping 20 (ζ 1). Ширина стартует на 60 мс позже. Высота 66,6 → 4 за 450 мс, <code>cubic-bezier(.16,1,.3,1)</code>. Углы — суперэллипс с R = min(w, h) / 2.'],
        ['цвет', '#03EDC3 → #EBE8E7 по пройденному пути: от 10 % до 80 % пути, <code>cubic-bezier(.4,0,.2,1)</code>.'],
        ['логотип', 'Движется вместе с центром иконки и обрезан её формой. Scale 1 → 0,6 за 200 мс <code>cubic-bezier(.4,0,1,1)</code>, opacity 1 → 0 за 160 мс linear.'],
        ['3340–3420', 'Настоящая шкала проявляется под севшей полоской (opacity, 80 мс).'],
        ['3440', 'Сплэш скрывается. Шва нет: полоска и трек совпадают по цвету и месту.'],
        ['2930–3910', 'Контент, по очереди сверху вниз с шагом 60 мс: язык → картинка → заголовок (одним блоком) → кнопка → подпись. Каждый: y 16 → 0 px на пружине Gentle 800 мс + opacity 0 → 1 за 400 мс <code>cubic-bezier(.4,0,.2,1)</code>.'],
        ['3480', 'Старт заполнения шкалы.'],
        ['пружины', 'Gentle (как в Figma): mass 1, stiffness 100, damping 15, ζ 0,75, перелёт ≈2,8 %. SwiftUI <code>.spring(response: 0.63, dampingFraction: 0.75)</code>, Compose <code>spring(dampingRatio = 0.75f, stiffness = 100f)</code>. Без перелёта: damping 20 — SwiftUI <code>dampingFraction: 1</code>, Compose <code>dampingRatio = 1f</code>.'],
        ['Reduce Motion', 'Без перелёта: сплэш гаснет за 300 мс (600–900 мс), контент сразу на месте.'],
      ],
    },
    slider: {
      name: 'Stories: push + цельная шкала',
      essence: 'Слайд едет целиком, шкала одна на все 5 слайдов и заполняется непрерывно. В прототипе: свайп мышью или пальцем, удержание — пауза, стрелки ← → на клавиатуре.',
      rows: [
        ['шкала', 'Фигуры, не картинка: трек 350×4, радиус 2 (полное скругление), #EBE8E7; заполнение — такая же пилюля #141414 со скруглённым передним краем, обрезанная треком. Заполнение = (номер слайда + прогресс слайда) / 5.'],
        ['слайд', '3000 мс на слайд. Часть заполнилась — переход на следующий. На 5-м шкала полная, автопрокрутка останавливается.'],
        ['смена', 'Push на ширину экрана, пружина Gentle 800 мс (перелёт ≈11 px) — и при автосмене, и после свайпа.'],
        ['свайп', 'Ось определяется после 6 px. Переход, если сдвиг > 20 % ширины (78 px) или флик: скорость > 0,4 px/мс за последние 80 мс и сдвиг > 24 px. На краях сопротивление ×0,18.'],
        ['удержание', 'Палец на экране — заполнение на паузе. Отменённый свайп — заполнение продолжается с того же места.'],
        ['назад', 'Переход на любой слайд обнуляет его часть шкалы и снова включает автопрокрутку, в том числе после финала.'],
        ['Reduce Motion', 'Вместо сдвига — кроссфейд 200 мс.'],
      ],
    },
  };
  function renderDesc(box, D) {
    box.innerHTML = `<h3></h3><p data-f="essence"></p><dl class="spec"></dl>`;
    box.querySelector('h3').textContent = D.name;
    box.querySelector('[data-f]').textContent = D.essence;
    // значения — статичный текст из этого файла (с <code>), не пользовательский ввод
    box.querySelector('.spec').innerHTML = D.rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  }
  renderDesc($('#loaderDesc'), SPEC.loader);
  renderDesc($('#sliderDesc'), SPEC.slider);

  $('#replay').addEventListener('click', playIntro);
  document.querySelectorAll('.speed').forEach((b) => b.addEventListener('click', () => {
    speed = parseFloat(b.dataset.speed);   // меняется на лету, без перезапуска
    document.querySelectorAll('.speed').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
  reduceMQ.addEventListener?.('change', playIntro);

  /* ===================== WEB VIEW ===================== */
  // Экран прототипа на весь экран телефона, как будто открыли приложение. Выход — крестик на экране или Esc.
  function fitWebview() {
    const vw = window.visualViewport ? visualViewport.width : innerWidth, vh = window.visualViewport ? visualViewport.height : innerHeight;
    const k = Math.min(vw / W, vh / 844);   // вписываем 390×844 целиком и центрируем
    screenEl.style.setProperty('--fs', k.toFixed(4));
    screenEl.style.setProperty('--fx', ((vw - W * k) / 2).toFixed(2) + 'px');
    screenEl.style.setProperty('--fy', ((vh - 844 * k) / 2).toFixed(2) + 'px');
  }
  function openWebview() {
    document.body.classList.add('webview');
    fitWebview();
    const de = document.documentElement;
    try { de.requestFullscreen?.().catch(() => {}); } catch (_) {}   // где браузер разрешает — ещё и без панелей браузера
    playIntro();
    $('#exitApp').focus({ preventScroll: true });
  }
  function closeWebview() {
    document.body.classList.remove('webview');
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (_) {}
    $('#openApp').focus({ preventScroll: true });
  }
  $('#openApp').addEventListener('click', openWebview);
  $('#exitApp').addEventListener('click', closeWebview);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.body.classList.contains('webview')) closeWebview(); });
  addEventListener('resize', () => { if (document.body.classList.contains('webview')) fitWebview(); });
  window.visualViewport?.addEventListener('resize', () => { if (document.body.classList.contains('webview')) fitWebview(); });

  function fit() {
    const dev = $('#device');
    const avail = Math.min(window.innerHeight - 110, 868);   // телефон + кнопки под ним в первом экране
    const byW = (Math.min(window.innerWidth, document.documentElement.clientWidth) - 32) / 414;
    dev.style.setProperty('--scale', Math.max(0.4, Math.min(1, avail / 868, byW)).toFixed(3));
  }
  addEventListener('resize', fit); fit();

  // Сразу ставим первый кадр (сплэш на весь экран), а сам таймлайн запускаем, когда загружены шрифт и иллюстрации —
  // загрузка проходит под сплэшем, как в приложении.
  resetAll();
  Promise.all([
    document.fonts.load("600 36px 'TT Fellows AZ'").catch(() => {}),
    document.fonts.ready,
    ...S.map((P) => P.img.decode().catch(() => {})),
  ]).then(playIntro);
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) document.body.classList.add('webview'), fitWebview();

  // step(ms) — детерминированная прокрутка времени для проверки
  const step = (ms, dt = 16) => { for (let t = 0; t < ms; t += dt) tick(dt * speed); };
  window.__proto = { st, clock, step, goTo, playIntro, layoutSlides };
})();
</script>
</body>
</html>
